# gitleaks over the full history of this repo. --verify additionally live-checks
# whether a found secret still authenticates; that is the slower, deliberate run,
# so it stays a typed command rather than a one-keypress action.

name = "secrets-audit"
description = "gitleaks over this repo's full history"
command = 'secrets-audit; printf "\n— done · press Enter to close (auto-closes in 120s) —\n"; read -t 120 _ </dev/tty || true'
