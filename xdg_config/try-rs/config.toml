# try-rs config — https://github.com/tassiovirginio/try-rs#2-config-file
# Picking a theme in the TUI (Ctrl+T) rewrites this file through the symlink
# and drops these comments; review the git diff before committing.
# editor is left unset so try-rs falls back to $VISUAL / $EDITOR.

# One TUI tab per path (←/→ to switch); the first is where `try <name>` creates.
tries_path = "~/projects/tries, ~/projects, ~/projects/fractory, ~/projects/fractory/code, ~/projects/fractory/pm-projects"
theme = "Tokyo Night"
