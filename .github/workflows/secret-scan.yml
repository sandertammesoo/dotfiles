name: Secret scan

# The pre-commit hook only protects commits made on a machine that has the
# hook installed and did not use --no-verify. This job is the backstop: it
# runs on GitHub, where none of that is under the committer's control.
#
# Push protection (a repository setting, not a workflow) rejects recognized
# provider tokens before they ever reach a branch. This job catches what push
# protection does not know about — generic keys, private key blocks, and
# anything matched only by the rules in .gitleaks.toml.
#
# Deliberately NOT on a schedule. GitHub disables scheduled workflows in a
# public repository after 60 days without activity, and this repository goes
# quiet for months at a time. The scan would switch itself off during exactly
# the periods when it was the only one running, and say nothing. Run
# `secrets-audit --verify` locally for the periodic check instead: it also
# verifies findings against the provider, which this job does not.

on:
  push:
    branches: [master, sander]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a pull-request-only diff would miss a secret that
          # arrived on a branch through a force-push or a rebase.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: |
          gitleaks git --log-opts="--all" \
            --no-banner \
            --redact=80 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
