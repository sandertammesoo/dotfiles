- defaults:
    link:
      create: true
      relink: true

- create: ["${XDG_CONFIG_HOME}", "${XDG_CONFIG_HOME}/gnupg"]

- clean:
    ~/:
      force: true
    ${XDG_CONFIG_HOME}:
      recursive: true
      force: true

- shell:
    # - git update-submodules # after linking ~/.gitconfig
    - command: git submodule update --init --recursive
      stdin: true
      stdout: true
      description: Installing submodules
      quiet: true

- link:
    ~/.zshenv:
      relink: true
      path: "xdg_config/zsh/.zshenv"
    ${XDG_CONFIG_HOME}/.dotfiles:
      relink: true
      path: "./"
    # ${XDG_CONFIG_HOME}/:
    #   glob: true
    #   path: "xdg_config/*"
    # prefix: "."
    ${XDG_CONFIG_HOME}/.zsh:
      relink: true
      path: "xdg_config/zsh"
    ${XDG_CONFIG_HOME}/.nvm:
      relink: true
      path: "xdg_config/nvm"
    ${XDG_CONFIG_HOME}/.hushlogin:
      relink: true
      path: "xdg_config/.hushlogin"
    ${XDG_CONFIG_HOME}/.editorconfig:
      relink: true
      path: "xdg_config/.editorconfig"
    ${XDG_CONFIG_HOME}/.inputrc:
      relink: true
      path: "xdg_config/.inputrc"
    ${XDG_CONFIG_HOME}/.warp:
      relink: true
      path: "xdg_config/warp"
    ${XDG_CONFIG_HOME}/lazygit:
      relink: true
      path: "xdg_config/lazygit"
    ${XDG_CONFIG_HOME}/vim:
      relink: true
      path: "xdg_config/vim"
    ${XDG_CONFIG_HOME}/git:
      relink: true
      path: "xdg_config/git"
    ${XDG_CONFIG_HOME}/yabai:
      relink: true
      path: "xdg_config/yabai"
    ${XDG_CONFIG_HOME}/skhd:
      relink: true
      path: "xdg_config/skhd"
    ${XDG_CONFIG_HOME}/sketchybar:
      relink: true
      path: "xdg_config/sketchybar"
    ${XDG_CONFIG_HOME}/.cheat:
      relink: true
      path: "xdg_config/cheat"
    ${XDG_CONFIG_HOME}/superfile:
      relink: true
      path: "xdg_config/superfile"
    ${XDG_CONFIG_HOME}/borders:
      relink: true
      path: "xdg_config/borders"
