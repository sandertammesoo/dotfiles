- defaults:
    link:
      create: true
      relink: true

- create:
    - "${XDG_CONFIG_HOME}"
    - "${XDG_DATA_HOME}"
    - "${XDG_CACHE_HOME}"
    - "${XDG_STATE_HOME}"
    - "${XDG_DATA_HOME}/gnupg"
    - "${XDG_STATE_HOME}/zsh"
    - "${XDG_STATE_HOME}/less"
    - "${XDG_STATE_HOME}/python"
    - "${XDG_STATE_HOME}/node"
    - "${XDG_CACHE_HOME}/npm"
    - "${XDG_CACHE_HOME}/python"
    - "${XDG_CACHE_HOME}/composer"
    - "${XDG_DATA_HOME}/cargo"
    - "${XDG_DATA_HOME}/rustup"
    - "${XDG_DATA_HOME}/composer"
    - "${XDG_CONFIG_HOME}/npm"
    - "${XDG_CONFIG_HOME}/docker"
    - "${XDG_CONFIG_HOME}/ipython"
    - "${XDG_CONFIG_HOME}/jupyter"

- clean:
    ~/:
      force: true

- shell:
    # - git update-submodules # after linking ~/.gitconfig
    - command: git submodule update --init --recursive
      stdin: true
      stdout: true
      description: Installing submodules

- link:
    ${XDG_CONFIG_HOME}/.dotfiles:
      relink: true
      path: "./"
    ${XDG_CONFIG_HOME}/.zsh:
      relink: true
      path: "xdg_config/zsh"
    ~/.zshenv:
      relink: true
      path: "${XDG_CONFIG_HOME}/.zsh/.zshenv"
    ${XDG_CONFIG_HOME}/.hushlogin:
      relink: true
      path: "xdg_config/.hushlogin"
    ${XDG_CONFIG_HOME}/.editorconfig:
      relink: true
      path: "xdg_config/.editorconfig"
    ${XDG_CONFIG_HOME}/.inputrc:
      relink: true
      path: "xdg_config/.inputrc"
    ${XDG_CONFIG_HOME}/worktrunk:
      relink: true
      path: "xdg_config/worktrunk"
    ${XDG_CONFIG_HOME}/tmux:
      relink: true
      path: "xdg_config/tmux"
    ${XDG_CONFIG_HOME}/wezterm:
      relink: true
      path: "xdg_config/wezterm"
    ${XDG_CONFIG_HOME}/atuin:
      relink: true
      path: "xdg_config/atuin"
    ${XDG_CONFIG_HOME}/atuin/themes/tokyo-night.toml:
      relink: true
      path: "git-submodules/atuin-tokyo-night/tokyo-night.toml"
    ${XDG_CONFIG_HOME}/.warp:
      relink: true
      path: "xdg_config/warp"
    ${XDG_CONFIG_HOME}/lazygit:
      relink: true
      path: "xdg_config/lazygit"
    ${XDG_CONFIG_HOME}/vim:
      relink: true
      path: "xdg_config/vim"
    ${XDG_CONFIG_HOME}/git:
      relink: true
      path: "xdg_config/git"
    ${XDG_CONFIG_HOME}/yabai:
      relink: true
      path: "xdg_config/yabai"
    ${XDG_CONFIG_HOME}/skhd:
      relink: true
      path: "xdg_config/skhd"
    ${XDG_CONFIG_HOME}/sketchybar:
      relink: true
      path: "xdg_config/sketchybar"
    ${XDG_CONFIG_HOME}/.cheat:
      relink: true
      path: "xdg_config/cheat"
    ${XDG_CONFIG_HOME}/superfile:
      relink: true
      path: "xdg_config/superfile"
    ${XDG_CONFIG_HOME}/borders:
      relink: true
      path: "xdg_config/borders"
    # ${XDG_CONFIG_HOME}/.gitconfig:
    #   relink: true
    #   path: "xdg_config/git/.gitconfig"
    # ${XDG_CONFIG_HOME}/.gitattributes:
    #   relink: true
    #   path: "xdg_config/git/.gitattributes"
    # ${XDG_CONFIG_HOME}/.gitignore:
    #   relink: true
    #   path: "xdg_config/git/.gitignore_global"
    # ~/projects:
    #   relink: true
    #   path: "$PROJECTS"

- shell:
    # - git update-submodules # after linking ~/.gitconfig
    - [git submodule update --init --recursive, Installing submodules]

- shell:
    - command: |
        if [ ! -f "$XDG_STATE_HOME/zsh/history" ]; then
          touch "$XDG_STATE_HOME/zsh/history"
        fi
        if [ -f "${HOME}/.zsh_history" ]; then
          cat "${HOME}/.zsh_history" >> "$XDG_STATE_HOME/zsh/history"
          rm "${HOME}/.zsh_history"
        fi
      stdin: true
      stdout: true
      description: Move or create zsh_history file
    - command: |
        if [ -d "${HOME}/.zsh_sessions" ]; then
          if [ ! -d "${XDG_STATE_HOME}/zsh/sessions" ]; then
            mkdir -p "${XDG_STATE_HOME}/zsh/sessions"
          fi
          mv "${HOME}/.zsh_sessions/"* "${XDG_STATE_HOME}/zsh/sessions/"
          rmdir "${HOME}/.zsh_sessions"
        fi
      stdin: true
      stdout: true
      description: Move zsh_sessions directory