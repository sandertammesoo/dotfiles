---
- defaults:
    link:
      create: true
      relink: true

- create: ["~/.config", "~/.config/gnupg"]

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true
      force: true

- shell:
    # - git update-submodules # after linking ~/.gitconfig
    - command: git submodule update --init --recursive
      stdin: true
      stdout: true
      description: Installing submodules
      quiet: true

- link:
    ~/.zshenv:
      relink: true
      path: "xdg_config/zsh/.zshenv"
    ~/.config/.dotfiles:
      relink: true
      path: ""
    # ~/.config/:
    #   glob: true
    #   path: "xdg_config/*"
    # prefix: "."
    ~/.config/.zsh:
      relink: true
      path: "xdg_config/zsh"
    ~/.config/.hushlogin:
      relink: true
      path: "xdg_config/.hushlogin"
    ~/.config/.editorconfig:
      relink: true
      path: "xdg_config/.editorconfig"
    ~/.config/.inputrc:
      relink: true
      path: "xdg_config/.inputrc"
    ~/.config/.warp:
      relink: true
      path: "xdg_config/warp"
    ~/.config/lazygit:
      relink: true
      path: "xdg_config/lazygit"
    ~/.config/vim:
      relink: true
      path: "xdg_config/vim"
    ~/.config/git:
      relink: true
      path: "xdg_config/git"
    ~/.config/yabai:
      relink: true
      path: "xdg_config/yabai"
    ~/.config/skhd:
      relink: true
      path: "xdg_config/skhd"
    ~/.config/sketchybar:
      relink: true
      path: "xdg_config/sketchybar"
    ~/.config/.cheat:
      relink: true
      path: "xdg_config/cheat"
    ~/.config/superfile:
      relink: true
      path: "xdg_config/superfile"
    ~/.config/borders:
      relink: true
      path: "xdg_config/borders"
    ~/.config/.gitconfig:
      relink: true
    #   path: "xdg_config/git/.gitconfig"
    # ~/.config/.gitattributes:
    #   relink: true
    #   path: "xdg_config/git/.gitattributes"
    # ~/.config/.gitignore:
    #   relink: true
    #   path: "xdg_config/git/.gitignore_global"
    # ~/projects:
    #   relink: true
    #   path: "$PROJECTS"
