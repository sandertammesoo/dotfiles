- defaults:
    link:
      create: true
      relink: true

- create:
    - "${XDG_CONFIG_HOME}"
    - "${XDG_DATA_HOME}"
    - "${XDG_CACHE_HOME}"
    - "${XDG_STATE_HOME}"
    - "${XDG_DATA_HOME}/gnupg"
    - "${XDG_STATE_HOME}/zsh"
    - "${XDG_STATE_HOME}/less"
    - "${XDG_STATE_HOME}/python"
    - "${XDG_STATE_HOME}/node"
    - "${XDG_CACHE_HOME}/npm"
    - "${XDG_CACHE_HOME}/python"
    - "${XDG_CACHE_HOME}/composer"
    - "${XDG_CACHE_HOME}/hq-sql"
    - "${XDG_DATA_HOME}/cargo"
    - "${XDG_DATA_HOME}/rustup"
    - "${XDG_DATA_HOME}/composer"
    - "${XDG_CONFIG_HOME}/npm"
    - "${XDG_CONFIG_HOME}/docker"
    - "${XDG_CONFIG_HOME}/ipython"
    - "${XDG_CONFIG_HOME}/jupyter"

- clean:
    ~/:
      force: true

# - shell:
#     # - git update-submodules # after linking ~/.gitconfig
#     - command: git submodule update --init --recursive
#       stdin: true
#       stdout: true
#       description: Installing submodules

- link:
    ${XDG_CONFIG_HOME}/.dotfiles:
      relink: true
      path: "./"
    ${XDG_CONFIG_HOME}/.zsh:
      relink: true
      path: "xdg_config/zsh"
    ~/.zshenv:
      relink: true
      path: "${XDG_CONFIG_HOME}/.zsh/.zshenv"
    ${XDG_CONFIG_HOME}/.hushlogin:
      relink: true
      path: "xdg_config/.hushlogin"
    ${XDG_CONFIG_HOME}/.editorconfig:
      relink: true
      path: "xdg_config/.editorconfig"
    ${XDG_CONFIG_HOME}/.inputrc:
      relink: true
      path: "xdg_config/.inputrc"
    ${XDG_CONFIG_HOME}/worktrunk:
      relink: true
      path: "xdg_config/worktrunk"
    ${XDG_CONFIG_HOME}/tmux:
      relink: true
      path: "xdg_config/tmux"
    ${XDG_CONFIG_HOME}/wezterm:
      relink: true
      path: "xdg_config/wezterm"
    ${XDG_CONFIG_HOME}/atuin:
      relink: true
      path: "xdg_config/atuin"
    ${XDG_CONFIG_HOME}/atuin/themes/tokyo-night.toml:
      relink: true
      path: "git-submodules/atuin-tokyo-night/tokyo-night.toml"
    ${XDG_CONFIG_HOME}/.warp:
      relink: true
      path: "xdg_config/warp"
    ${XDG_CONFIG_HOME}/lazygit:
      relink: true
      path: "xdg_config/lazygit"
    ${XDG_CONFIG_HOME}/vim:
      relink: true
      path: "xdg_config/vim"
    # git: whole-dir link, which also delivers hooks/ — the global pre-commit
    # secret gate that core.hooksPath points at (see zsh-setup-scripts/gitleaks)
    ${XDG_CONFIG_HOME}/git:
      relink: true
      path: "xdg_config/git"
    ${XDG_CONFIG_HOME}/gitleaks:
      relink: true
      path: "xdg_config/gitleaks"
    ${XDG_CONFIG_HOME}/yabai:
      relink: true
      path: "xdg_config/yabai"
    ${XDG_CONFIG_HOME}/skhd:
      relink: true
      path: "xdg_config/skhd"
    ${XDG_CONFIG_HOME}/sketchybar:
      relink: true
      path: "xdg_config/sketchybar"
    ${XDG_CONFIG_HOME}/.cheat:
      relink: true
      path: "xdg_config/cheat"
    ${XDG_CONFIG_HOME}/superfile:
      relink: true
      path: "xdg_config/superfile"
    ${XDG_CONFIG_HOME}/borders:
      relink: true
      path: "xdg_config/borders"
    ${XDG_CONFIG_HOME}/television:
      relink: true
      path: "xdg_config/television"
    # harlequin: whole-dir link is safe — caches go to ~/.cache/harlequin
    # and data to ~/.local/share/harlequin, never into the config dir
    ${XDG_CONFIG_HOME}/harlequin:
      relink: true
      path: "xdg_config/harlequin"
    # mise: link only config.toml — ~/.config/mise also holds trust
    # state (trusted-configs) that must not live in the repo
    ${XDG_CONFIG_HOME}/mise/config.toml:
      relink: true
      path: "xdg_config/mise/config.toml"
    # try-rs: link only config.toml — the try-rs/ dir also holds the
    # generated try-rs.zsh (see zsh-setup-scripts/try-rs/completion.zsh)
    ${XDG_CONFIG_HOME}/try-rs/config.toml:
      relink: true
      path: "xdg_config/try-rs/config.toml"
    # herdr: link only config.toml — ~/.config/herdr also holds runtime
    # sockets/logs/session state that must not live in the repo
    ${XDG_CONFIG_HOME}/herdr/config.toml:
      relink: true
      path: "xdg_config/herdr/config.toml"
    # herdr plugin config: same reason — link the single file, not the
    # plugins/ tree, which herdr owns and rewrites on install/uninstall
    ${XDG_CONFIG_HOME}/herdr/plugins/config/worktrunk/config.toml:
      relink: true
      path: "xdg_config/herdr/plugins/config/worktrunk/config.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cdragon.command-center/commands.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cdragon.command-center/commands.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/herdr-navigator/config.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/herdr-navigator/config.toml"
    # herdr-plus project templates: one file per project, linked individually —
    # the plugin seeds its own examples into the same projects/ directory
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/projects/dotfiles.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/projects/dotfiles.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/config.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/config.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/worktrees/wildcard.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/worktrees/wildcard.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/worktrees/dotfiles.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/worktrees/dotfiles.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/quick-actions/open-project.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/quick-actions/open-project.toml"
    ${XDG_CONFIG_HOME}/herdr/plugins/config/cloudmanic.herdr-plus/quick-actions/brew-outdated.toml:
      relink: true
      force: true
      path: "xdg_config/herdr/plugins/config/cloudmanic.herdr-plus/quick-actions/brew-outdated.toml"
    # hunk: link only config.toml — ~/.config/hunk also holds runtime
    # state (state.json) that must not live in the repo
    # yazi: link the three files we own — flavors/ next to them is vendored by
    # `ya pkg install` from the pin in package.toml, and must not live in the repo
    ${XDG_CONFIG_HOME}/yazi/yazi.toml:
      relink: true
      path: "xdg_config/yazi/yazi.toml"
    ${XDG_CONFIG_HOME}/yazi/theme.toml:
      relink: true
      path: "xdg_config/yazi/theme.toml"
    ${XDG_CONFIG_HOME}/yazi/package.toml:
      relink: true
      path: "xdg_config/yazi/package.toml"
    ${XDG_CONFIG_HOME}/hunk/config.toml:
      relink: true
      path: "xdg_config/hunk/config.toml"
    ${HOME}/.local/bin/hq-sql:
      relink: true
      path: "xdg_config/harlequin/scripts/hq-sql"
    ${HOME}/.local/bin/tv-claude-history:
      relink: true
      path: "xdg_config/television/scripts/tv-claude-history"
    ${HOME}/.local/bin/tv-claude-history-preview:
      relink: true
      path: "xdg_config/television/scripts/tv-claude-history-preview"
    ${HOME}/.local/bin/tv-claude-sessions:
      relink: true
      path: "xdg_config/television/scripts/tv-claude-sessions"
    ${HOME}/.local/bin/tv-claude-session-preview:
      relink: true
      path: "xdg_config/television/scripts/tv-claude-session-preview"
    ${HOME}/.local/bin/tv-claude-memory:
      relink: true
      path: "xdg_config/television/scripts/tv-claude-memory"
    ${HOME}/.local/bin/wl-vol:
      relink: true
      path: "xdg_config/wavelink/scripts/wl-vol"
    ${HOME}/.local/bin/wl-keys:
      relink: true
      path: "xdg_config/wavelink/scripts/wl-keys"
    # ${XDG_CONFIG_HOME}/.gitconfig:
    #   relink: true
    #   path: "xdg_config/git/.gitconfig"
    # ${XDG_CONFIG_HOME}/.gitattributes:
    #   relink: true
    #   path: "xdg_config/git/.gitattributes"
    # ${XDG_CONFIG_HOME}/.gitignore:
    #   relink: true
    #   path: "xdg_config/git/.gitignore_global"
