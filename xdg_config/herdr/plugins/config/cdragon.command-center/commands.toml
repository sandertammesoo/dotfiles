schema_version = 1

# Editors the popup offers for `shift+o` (edit this file). Trimmed from the
# eight-entry seed to the two that are actually on this machine: several
# candidates make the popup ask which one, one opens straight away.
editor = ["code", "vim"]

# Slots are the key that runs the entry: 1-9, 0, then a-z. A slot is stored with
# its command, so it survives reordering. Lowercase and digits run; uppercase
# acts on the list (shift+a add, shift+e edit, shift+d delete, shift+o open this
# file, shift+i import from config.toml).
#
# The plugin_action entries below duplicate the prefix+alt+ group in
# ../../../config.toml on purpose. Both routes stay: the keys are muscle memory,
# and this popup is the one door to find when the memory fails.

# --- Worktrees (worktrunk) -------------------------------------------------

[[commands]]
id = "worktree-switch-create"
slot = "g"
label = "Worktree: switch / create"
type = "plugin_action"
command = "worktrunk.open"
description = "Branch off the default branch — same as prefix+shift+g"

[[commands]]
id = "worktree-switch-create-current"
slot = "c"
label = "Worktree: switch / create from current"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Branch off the current branch — same as prefix+alt+c"

[[commands]]
id = "worktree-switch-create-remotes"
slot = "w"
label = "Worktree: switch / create incl. remotes"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Picker including remote branches — same as prefix+alt+w"

[[commands]]
id = "worktree-merge"
slot = "m"
label = "Worktree: merge into target branch"
type = "plugin_action"
command = "worktrunk.merge"
description = "Squash merge and run worktrunk's hooks — same as prefix+alt+m"

[[commands]]
id = "worktree-merge-no-squash"
slot = "n"
label = "Worktree: merge without squashing"
type = "plugin_action"
command = "worktrunk.merge-no-squash"
description = "Keep every commit — no keybinding, popup only"

[[commands]]
id = "worktree-remove"
slot = "x"
label = "Worktree: remove"
type = "plugin_action"
command = "worktrunk.remove"
description = "Tear down through worktrunk's hooks — same as prefix+alt+x"

# --- Projects ----------------------------------------------------------------

[[commands]]
id = "herdr-plus-projects"
slot = "4"
label = "Projects"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "Open a project workspace from its template — also Ctrl-P in the navigator"

[[commands]]
id = "herdr-plus-quick-actions"
slot = "q"
label = "Quick actions"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus quick actions — also Ctrl-Q in the navigator"

# --- Navigation --------------------------------------------------------------

[[commands]]
id = "navigator"
slot = "j"
label = "Navigator: jump to anything"
type = "plugin_action"
command = "herdr-navigator.open"
description = "Workspaces, agents, projects, sessions, zoxide dirs — same as prefix+f"

[[commands]]
id = "navigator-jump-back"
slot = "k"
label = "Navigator: jump back"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "Return to the previous workspace — same as prefix+shift+f"

[[commands]]
id = "navigator-side"
slot = "o"
label = "Navigator: side pane"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "Keep the navigator docked — same as prefix+alt+f"

# --- Files ------------------------------------------------------------------

[[commands]]
id = "file-explorer"
slot = "f"
label = "File explorer (split)"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "Yazi beside the current pane — same as prefix+y"

[[commands]]
id = "file-explorer-tab"
slot = "t"
label = "File explorer (new tab)"
type = "plugin_action"
command = "ray.file-explorer.open-tab"
description = "Yazi full width in its own tab — same as prefix+shift+y"

[[commands]]
id = "sidebar-explorer"
slot = "b"
label = "Sidebar: file tree"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "VS Code-style explorer docked in the tab — same as prefix+shift+b"

[[commands]]
id = "sidebar-source-control"
slot = "v"
label = "Sidebar: source control"
type = "plugin_action"
command = "herdr-sidebar.open-git"
description = "Staging, diffs and history in a docked pane — same as prefix+shift+s"

# --- herdr itself ----------------------------------------------------------

[[commands]]
id = "plugin-manager"
slot = "p"
label = "Plugin manager"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "Install, update and toggle herdr plugins — same as prefix+alt+p"

[[commands]]
id = "tab-rename-reset"
slot = "r"
label = "Re-adopt a hand-renamed tab"
type = "plugin_action"
command = "herdr-automatic-rename.reset"
description = "Hand the tab back to automatic naming — same as prefix+alt+r"

[[commands]]
id = "reload-herdr-config"
slot = "0"
label = "Reload herdr config"
type = "shell"
command = "herdr server reload-config"
description = "Apply config.toml edits without restarting the server"

# --- Repo shortcuts --------------------------------------------------------

[[commands]]
id = "open-in-vs-code"
slot = "1"
label = "Open in VS Code"
type = "shell"
command = "code ."
cwd = "focused"
description = "Open the focused pane's directory in VS Code"

[[commands]]
id = "open-repo-on-github"
slot = "2"
label = "Open repo on GitHub"
type = "shell"
command = "gh browse"
cwd = "focused"
description = "Open the current repository in the browser"

[[commands]]
id = "open-pull-request"
slot = "3"
label = "Open pull request"
type = "shell"
command = "gh pr view --web"
cwd = "focused"
description = "Open this branch's pull request in the browser"

# type = "pane" types the command into the pane you were looking at, so you see
# the output. herdr refuses it when that pane runs an agent — it would go to the
# agent as a prompt — so these are for shell panes only.

[[commands]]
id = "git-status"
slot = "s"
label = "git status"
type = "pane"
command = "git status --short --branch"
description = "Short status in the focused shell pane"

[[commands]]
id = "hunk-diff"
slot = "d"
label = "Review the diff (hunk)"
type = "pane"
command = "hunk"
description = "Stage and review hunks in the focused shell pane"

[[commands]]
id = "worktree-list"
slot = "l"
label = "List worktrees"
type = "pane"
command = "wt list"
description = "Every worktree worktrunk knows about, in the focused shell pane"
