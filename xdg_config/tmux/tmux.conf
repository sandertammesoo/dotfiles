# ── Resurrect ───────────────────────────────────────────────────────────────────
# resurrect: also save/restore pane contents and common programs
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim'

# ── Continuum ───────────────────────────────────────────────────────────────────
# continuum: auto-save every 15 min, auto-restore on tmux server start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Search for tpm in Homebrew installation paths and run it
run 'bash -c "[ -x /opt/homebrew/opt/tpm/share/tpm/tpm ] && /opt/homebrew/opt/tpm/share/tpm/tpm || ([ -x /usr/local/opt/tpm/share/tpm/tpm ] && /usr/local/opt/tpm/share/tpm/tpm) || ([ -x /home/linuxbrew/.linuxbrew/opt/tpm/share/tpm/tpm ] && /home/linuxbrew/.linuxbrew/opt/tpm/share/tpm/tpm) || echo \"WARN: TMUX Plugin Manager (tpm) not found\""'

# Override status-left AFTER plugins load so tokyo-night-tmux doesn't overwrite it.
# Changes background to orange when prefix is active (plugin only swaps an icon, too subtle).
# Colors from tokyo-night-tmux night theme: bg=#1a1b26, blue=#7aa2f7, bblack=#2a2f41
set -g status-left "#{?client_prefix,#[fg=#1a1b26 bg=#ff9e64 bold],#[fg=#2a2f41 bg=#7aa2f7 bold]} #{?client_prefix,󰠠 ,#[dim]󰤂 }#[nodim] #S "