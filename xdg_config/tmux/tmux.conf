# ~/.config/tmux/tmux.conf
# tmux config for local + remote use.
# Plugins managed by TPM: https://github.com/tmux-plugins/tpm
#
# First-time setup:
#   brew install tmux
#   brew install tpm
#   tmux source $XDG_CONFIG_HOME/tmux/tmux.conf
#   then press prefix + I to install plugins
 
 
# ── Prefix ────────────────────────────────────────────────────────────────────
 
# Keep default Ctrl-b. If you prefer Ctrl-a (screen-style), swap these:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

## Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# # Unset Ctrl+Space from prefix and bind the default prefix to Ctrl+b
# unbind C-Space
# set -g prefix C-b
# bind C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
 
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color passthrough to WezTerm
 
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1        # panes too
set -g renumber-windows on       # close window 2 of 3 → window 3 becomes 2
 
set -g history-limit 50000
set -g display-time 2000         # status messages linger 2s
set -g escape-time 0             # no delay on Escape (critical for vim/nvim)
set -g focus-events on           # pass focus events through to apps
set -sg repeat-time 600          # allow repeated keys after prefix without re-pressing it
 
setw -g mode-keys vi             # vi keys in copy mode

# Do not ask for confirmation when killing a window/pane
bind-key x kill-pane #\; display "Pane closed"
bind-key & kill-window #\; display "Window closed"
 
# ── Mouse ─────────────────────────────────────────────────────────────────────
 
set -g mouse on


# ── Reload config ─────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf #\; display "Config reloaded"
 

# ── Windows & Panes ───────────────────────────────────────────────────────────
 
# Open new windows/panes in the current directory
bind c new-window -c "#{pane_current_path}"
# If splits are handled by WezTerm (CMD+D / CMD+Shift+D) — no prefix bindings needed
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Resize panes with capital HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# Move between windows
bind -r C-h previous-window
bind -r C-l next-window


# ── SessionX ──────────────────────────────────────────────────────────────────
set -g @sessionx-bind 's'                    # prefix + s opens sessionx
set -g @sessionx-window-mode 'on'            # show windows too, not just sessions
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '30%'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '90%'

# By default, the current session will not be shown on first view
# This is to support quick switch of sessions
# Only after other actions (e.g. rename) will the current session appear
# Setting this option to 'false' changes this default behavior
set -g @sessionx-filter-current 'false'

# Uses `fzf --tmux` instead of the `fzf-tmux` script (requires fzf >= 0.53).
set -g @sessionx-fzf-builtin-tmux 'on'

# Customize `ls` command to display your directories nicely (default: `ls`)
# Can be used with `exa`, `lsd`, or other command of your choice to
# set preview window to match your preference
# set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
set -g @sessionx-ls-command 'eza --tree --color=always --icons'  # requires eza installed

# When set to 'on' a non-result will be sent to zoxide for path matching
# Requires zoxide installed
set -g @sessionx-zoxide-mode 'on'

# If you want to pass in your own FZF options. This is passed in before all other
# arguments to FZF to ensure that other options like `sessionx-pointer` and
# `sessionx-window-height/width` still work. See `man fzf` for config options.
# Tokyo Night colors for fzf, to match WezTerm's theme
set -g @sessionx-additional-options "--color bg:#1a1b26,bg+:#292e42,fg:#a9b1d6,fg+:#c0caf5,hl:#7aa2f7,hl+:#7aa2f7,border:#414868,prompt:#7aa2f7,pointer:#7aa2f7,marker:#9ece6a,info:#9ece6a"
# set -g @sessionx-additional-options ""

# set -g @sessionx-fzf-colors 'bg:#1a1b26,bg+:#292e42,fg:#a9b1d6,fg+:#c0caf5,hl:#7aa2f7,hl+:#7aa2f7,border:#414868,prompt:#7aa2f7,pointer:#7aa2f7,marker:#9ece6a,info:#9ece6a'

# Display the current git branch next to each session name.
# Branches are loaded asynchronously so session list appears instantly.
# Requires git. (default: off)
set -g @sessionx-git-branch 'on'

# New named session
bind N command-prompt "new-session -s '%%'"

# tms — project session launcher
bind o display-popup -E "tms"           # prefix + o → fuzzy find & open any project
bind S display-popup -E "tms switch"    # prefix + S → switch active sessions with preview


# ── Copy mode (vi) ────────────────────────────────────────────────────────────
 
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"   # macOS clipboard
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# ── Appearance ────────────────────────────────────────────────────────────────

# set -g @catppuccin_flavour 'mocha' # latte, frappe, macchiato, mocha
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# ── Status bar ──
set -g status on
set -g status-position top # -- top, bottom
 
## Tokyo Night theme for tmux's status bar, to match WezTerm's theme
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme night    # storm | day | default to 'night'
set -g @tokyo-night-tmux_transparent 0  # 1 or 0
set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
## Icon styles
set -g @tokyo-night-tmux_terminal_icon ""
set -g @tokyo-night-tmux_active_terminal_icon ""
## No extra spaces between icons
set -g @tokyo-night-tmux_window_tidy_icons 0
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format YMD
set -g @tokyo-night-tmux_time_format 24H
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative # 'relative' or 'full'
set -g @tokyo-night-tmux_show_hostname 1


