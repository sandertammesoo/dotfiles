# herdr configuration — https://herdr.dev/docs/configuration/
# Linked as a single file into ~/.config/herdr/ because that directory also
# holds runtime state (sockets, logs, session.json) that must stay out of git.
# Full annotated reference: herdr --default-config
# Apply changes with: herdr server reload-config

[theme]
name = "terminal"

auto_switch = false
[keys]
# prefix = "ctrl+b"             # default; same as tmux — don't nest tmux inside herdr

# lazygit in a temporary pane; closes when lazygit exits
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[ui]
# Show detected agent name (claude, codex, ...) in split pane borders —
# useful when running parallel agent sessions in one workspace
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[session]
# Resume Claude Code panes into their native conversations after a herdr
# server restart (requires the claude integration to be installed)
resume_agents_on_restore = true

[ui.toast]
delivery = "herdr"
