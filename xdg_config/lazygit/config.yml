# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/refs/tags/v0.63.1/schema/config.json
gui:
  # Fraction of the total screen width to use for the left side section. You may
  # want to pick a small number (e.g. 0.2) if you're using a narrow screen, so
  # that you can see more of the main section.
  # Number from 0 to 1.0.
  sidePanelWidth: 0.25
git:
  # Array of pagers. Each entry has the following format:
  #
  #   # Value of the --color arg in the git diff command. Some pagers want
  #   # this to be set to 'always' and some want it set to 'never'
  #   colorArg: "always"
  #
  #   # e.g.
  #   # diff-so-fancy
  #   # delta --dark --paging=never
  #   # ydiff -p cat -s --wrap --width={{columnWidth}}
  #   pager: ""
  #
  #   # e.g. 'difft --color=always'
  #   externalDiffCommand: ""
  #
  #   # If true, Lazygit will use git's `diff.external` config for paging.
  #   # The advantage over `externalDiffCommand` is that this can be
  #   # configured per file type in .gitattributes; see
  #   # https://git-scm.com/docs/gitattributes#_defining_an_external_diff_driver.
  #   useExternalDiffGitConfig: false
  #
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Pagers.md
  # for more information.
  # pagers:
  #   - pager: delta --dark --paging=never --line-numbers --side-by-side --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  pagers:
    - # see: delta --help
      pager: delta --paging=never
      # pager: delta --paging=never --side-by-side --line-numbers --hyperlinks
      # pager: --dark --paging=never --line-numbers --side-by-side --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      colorArg: always
  # Command used when displaying the current branch git log in the main window
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=local --date-order --pretty=oneline {{branchName}} --
  # branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} -- # Default config
  # branchLogCmd: "git log --graph --pretty=format:'%Cred%h%Creset - %C(auto)%d%Creset %s %Cgreen(%cr by %C(bold blue)<%an>%Cgreen)%Creset %C(yellow)(%cd)' --date=local -n 20 --abbrev-commit --date-order {{branchName}} --"

  # Commands used to display git log of all branches in the main window, they will
  # be cycled in order of appearance (array of strings)
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=local --date-order --pretty=oneline
    # - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium # Default config
  # allBranchesLogCmd: "git log --graph --all --color=always --abbrev-commit --decorate --date=local --date-order --pretty=oneline"
  # allBranchesLogCmd: "git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium"
  # allBranchesLogCmd: "git log --graph --pretty=format:'%Cred%h%Creset - %C(auto)%d%Creset %s %Cgreen(%cr by %C(bold blue)<%an>%Cgreen)%Creset %C(yellow)(%cd)' --date=local -n 20 --abbrev-commit --date-order --all"
os:
  # Command for editing a file. Should contain "{{filename}}".
  edit: "vim {{filename}}"
  # Command for editing a file at a given line number. Should contain
  # "{{filename}}", and may optionally contain "{{line}}".
  editAtLine: "vim +{{line}} {{filename}}"
  # Same as EditAtLine, except that the command needs to wait until the window is
  # closed.
  # editAtLineAndWait: ""

  # Whether lazygit suspends until an edit process returns
  # editInTerminal: false

  # For opening a directory in an editor
  # openDirInEditor: ""

  # A built-in preset that sets all of the above settings. Supported presets are
  # defined in the getPreset function in editor_presets.go.
  # editPreset: ""

  # Command for opening a file, as if the file is double-clicked. Should contain
  # "{{filename}}", but doesn't support "{{line}}".
  open: "open {{filename}}"
  # Command for opening a link. Should contain "{{link}}".
  # openLink: ""

  # CopyToClipboardCmd is the command for copying to clipboard.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-command-for-copying-to-and-pasting-from-clipboard
  # copyToClipboardCmd: ""

  # ReadFromClipboardCmd is the command for reading the clipboard.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-command-for-copying-to-and-pasting-from-clipboard
  # readFromClipboardCmd: ""

  # A shell startup file containing shell aliases or shell functions. This will be
  # sourced before running any shell commands, so that shell functions are
  # available in the `:` command prompt or even in custom commands.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#using-aliases-or-functions-in-shell-commands
  # shellFunctionsFile: ""
# What to do when opening Lazygit outside of a git repo.
# - 'prompt': (default) ask whether to initialize a new repo or open in the most
# recent repo
# - 'create': initialize a new repo
# - 'skip': open most recent repo
# - 'quit': exit Lazygit
notARepository: prompt
# H opens hunk (review UI) from the four review panels; output: terminal
# suspends lazygit while hunk owns the terminal. Shadows global "scroll
# main panel left" (H) in these contexts only. Delta stays the stream
# colorizer for the embedded diff pane — see xdg_config/git/config.
customCommands:
  - key: H
    description: Review working tree in hunk
    command: hunk diff
    context: files
    output: terminal
  - key: H
    description: Review selected commit in hunk
    command: hunk show {{.SelectedCommit.Hash}}
    context: commits
    output: terminal
  - key: H
    description: Review working tree vs selected branch in hunk
    command: hunk diff {{.SelectedLocalBranch.Name}}
    context: localBranches
    output: terminal
  - key: H
    description: Review selected stash entry in hunk
    # renders as `hunk stash show stash@{N}` — hunk rejects a bare index,
    # and literal braces must be template-escaped next to {{...}}
    command: 'hunk stash show stash@{{"{"}}{{.SelectedStashEntry.Index}}{{"}"}}'
    context: stash
    output: terminal
