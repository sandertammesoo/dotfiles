# Harlequin — SQL IDE for the terminal https://harlequin.sh
# Linked by dotbot: ~/.config/harlequin -> xdg_config/harlequin
#
# Harlequin merges this file with any pyproject.toml / .harlequin.toml found
# in the working directory, so per-project profiles can extend or override it.
# The `harlequin --config` and `harlequin --keys` wizards edit this file in
# place (through the symlink), so wizard changes land in the repo.
#
# Do not put credentials in profiles here — postgres/mysql profiles should
# rely on ~/.pgpass or passwordless connection strings.

default_profile = "duckdb"

[profiles.duckdb]
adapter = "duckdb"
theme = "tokyo-night"
limit = 100

[profiles.sqlite]
adapter = "sqlite"
theme = "tokyo-night"
limit = 100

# Fractory API database profiles are intentionally NOT stored here — the
# hq-staging / hq-prod zsh functions (zsh-setup-scripts/harlequin/
# functions.zsh) build them at launch from 1Password DATABASE items
# (host, port, database, user, password) and append them to a 0600 temp
# copy of this file, passed via --config-path (merged last, so a cwd
# .harlequin.toml cannot hijack them). Do not re-add profiles with those
# names here — the appended TOML table would collide and fail to parse.
