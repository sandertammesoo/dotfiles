# ~/.config/.zsh/starship.toml

# Inserts a blank line between shell prompts
add_newline = true

# Change command timeout from 500 to 1000 ms
command_timeout = 1000

# Place this line directly under the `command_timeout` entry at the top of the file
palette = "catppuccin_mocha" # Other flavours: latte, frappe, macchiato, mocha

# Change the default prompt format
# ---
format = """\
[╭╴](bold white)$env_var \
$username\
$hostname\
$localip\
$directory\
$git_branch$git_status\
$fill \
$all\
${custom.git_config_email}
[╰─](bold white)$character"""

# Fill character (empty space) between the left and right prompt
[fill]
symbol = ' '
# symbol = '─'
# style =  "bold white"

# Disable the line break between the first and second prompt lines
[line_break]
disabled = true

# Change the default prompt characters
[character]
# old config
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
# success_symbol = "[](238)"
# error_symbol = "[](bold red)"

# Shows an icon that should be included by zshrc script based on the distribution or os
[env_var.STARSHIP_DISTRO]
format = '[$env_value](white)'
variable = "STARSHIP_DISTRO"
disabled = false

# Shows the username
[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user ]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
disabled = false

[localip]
ssh_only = true
format = '[\($localipv4\)](bold yellow) '
disabled = false

[directory]
truncation_length = 10
# truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = " ~"
read_only_style = "197"
read_only = "  "
format = "[ $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
truncation_symbol = "…/"
style = "bold green"

[git_status]
# Wraps indicators in dim brackets, snug against the branch name
format = '([$all_status$ahead_behind]($style) )'
style = "dimmed white"
conflicted = "[ $count](bold red) "
up_to_date = ""                            # empty = nothing shown when clean
untracked  = "[ $count](yellow) "
ahead      = "[ $count](cyan) "
behind     = "[ $count](magenta) "
diverged   = "[](bold red) [ $ahead_count](cyan) [ $behind_count](magenta) "
stashed    = "[ $count](bold yellow) "
modified   = "[ $count](yellow) "
staged     = "[ $count](bold green) "
renamed    = "[ $count](cyan) "
deleted    = "[ $count](red) "

[status]
disabled = false
format = '[\[$status - $common_meaning\] ](red)'

[kubernetes]
format = "[ $(context)($(namespace))](bold purple) "
disabled = true


[terraform]
format = "[ terraform $version]($style)  [$workspace]($style) "
disabled = true

[vagrant]
format = "[ vagrant $version]($style) "
disabled = true

[docker_context]
format = "[ $context](bold blue) "
disabled = false

[helm]
format = "[ $version](bold purple) "
disabled = true

[python]
symbol = " "
python_binary = "python3"
disabled = false

[nodejs]
format = "[ $version](bold green) "
disabled = false

[ruby]
format = "[ $version]($style) "
disabled = true

[golang]
format = "[ $version](bold cyan) "
disabled = false

[time]
disabled = true
format = '[\[$time\]](dimmed white) '
# time_format = "%a %b %d %Y %T:%3f"
time_format = "%T"

[cmd_duration]
disabled = false 
min_time = 2_000
format = 'took [$duration](bold yellow) '

# Output the current git config email address
[custom.git_config_email]
description = "Output the current git user's configured email address."
command = "git config user.email"
format = "\n[│](bold white)[$symbol(  $output)]($style)"
# Only when inside git repository — native check, no shell-out (a `when`
# command here spawns a subprocess per prompt and can hit command_timeout).
# `require_repo` alone is not a display condition, hence `when = true`.
when = true
require_repo = true
style = "text"

